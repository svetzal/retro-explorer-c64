# Settings for scripts/c64.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Copy each table from the target tables in
# guidance/starter/toolchain.md. scripts/c64.py checks the ROMs against
# firmware.json before launch, and checks the chips that VICE reports.
[targets.c64-ntsc]
model = "ntsc"                    # VICE -model: C64 NTSC
video = "ntsc"
vicii = "6567"
sid = "6581"
ram_kib = 64
kernal = "kernal-901227-03.bin"
basic = "basic-901226-01.bin"
chargen = "chargen-901225-01.bin"

[check]
checkpoint = "sample"
hit = 1
cycle_limit = 20_000_000

[variants.partial]
defines = ["SAMPLE_UPDATE:=14"]

[variants.touch]
defines = ["SAMPLE_UPDATE:=17"]

[variants.separate]
defines = ["SAMPLE_UPDATE:=30"]

[variants.turn]
defines = ["SAMPLE_UPDATE:=33"]

[variants.timing]
defines = ["SAMPLE_UPDATE:=65"]

[variants.shot-crossing]
defines = ["CHARACTER_SHOTS:=true", "SAMPLE_UPDATE:=30"]

[variants.shot-separation]
defines = ["CHARACTER_SHOTS:=true", "SAMPLE_UPDATE:=42"]

[variants.shot-timing]
defines = ["CHARACTER_SHOTS:=true", "SAMPLE_UPDATE:=65"]
