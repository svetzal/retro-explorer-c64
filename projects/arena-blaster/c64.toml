# Settings for scripts/c64.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Copy each table from the target tables in
# guidance/starter/toolchain.md and record its values in the README contract.
# scripts/c64.py checks the ROMs against firmware.json before launch, and checks
# the chips that VICE reports.
[targets.c64-ntsc]
model = "ntsc"                    # VICE -model: C64 NTSC
video = "ntsc"
vicii = "6567"
sid = "6581"
ram_kib = 64
kernal = "kernal-901227-03.bin"
basic = "basic-901226-01.bin"
chargen = "chargen-901225-01.bin"

# For the check: the label where the snapshot is taken, how many times the
# program must pass it, an address that must never run, and the run limit.
[check]
checkpoint = "frame"
hit = 5                           # include a second shot step before the snapshot
unreachable = ["frame+1"]         # mid-instruction: must never execute
cycle_limit = 20_000_000          # emulated cycles from power-on
screen = 0x0400
colours = 0xd800
border_ring = 16

[variants.strafe]
defines = ["CHECK_INPUT:=66"]

[variants.hit]
defines = ["CHECK_INPUT:=128", "CHECK_ROBOT_X:=21"]

[variants.chase]
defines = ["CHECK_INPUT:=8", "CHECK_CHASE:=1"]

[variants.caught]
defines = ["CHECK_INPUT:=16", "CHECK_CHASE:=1", "CHECK_ROBOT_X:=21"]

[variants.edge]
defines = ["CHECK_EDGE:=true", "CHECK_INPUT:=34"]

[variants.replay]
defines = ["CHECK_REPLAY:=true", "CHECK_ROBOT_X:=21"]

# Low four bits move. High four bits aim. Each group uses up, left, down, right.
[variants.northwest]
defines = ["CHECK_INPUT:=$c3"]

[variants.northeast]
defines = ["CHECK_INPUT:=$69"]

[variants.southwest]
defines = ["CHECK_INPUT:=$96"]

[variants.southeast]
defines = ["CHECK_INPUT:=$3c"]

[variants.slide]
defines = ["CHECK_EDGE:=true", "CHECK_INPUT:=$33"]

[variants.opposed]
defines = ["CHECK_INPUT:=$ff"]

[variants.one-axis]
defines = ["CHECK_INPUT:=$bd"]
