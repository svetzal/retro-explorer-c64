# Settings for scripts/c64.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Copy each table from the target tables in
# guidance/starter/toolchain.md. scripts/c64.py checks the ROMs against
# firmware.json before launch, and checks the chips that VICE reports.
[targets.c64-pal]
model = "c64"                     # VICE -model: C64 PAL
video = "pal"
vicii = "6569"
sid = "6581"
ram_kib = 64
kernal = "kernal-901227-03.bin"
basic = "basic-901226-01.bin"
chargen = "chargen-901225-01.bin"

[targets.c64-ntsc]
model = "ntsc"                    # VICE -model: C64 NTSC
video = "ntsc"
vicii = "6567"
sid = "6581"
ram_kib = 64
kernal = "kernal-901227-03.bin"
basic = "basic-901226-01.bin"
chargen = "chargen-901225-01.bin"

[check]
checkpoint = "shown"              # passed once in each frame after the screen is set
hit = 3                           # two full frames are drawn before the snapshot
unreachable = ["shown+1"]         # mid-instruction: must never execute
cycle_limit = 20_000_000          # emulated cycles from power-on
screen = 0x0400                   # expected_screen is compared from here
colours = 0xD800                  # expected_colours is compared from here
border_ring = 16                  # border pixels around the display window to compare

# Character set 2: upper and lower case letters.
[variants.mixed-case]
defines = ["MIXED_CASE:=true"]
