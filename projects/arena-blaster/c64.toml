# Settings for scripts/c64.py. Paths are relative to this folder.
source = "main.asm"

# The first target is the default. Copy each table from the target tables in
# guidance/starter/toolchain.md and record its values in the README contract.
# scripts/c64.py checks the ROMs against firmware.json before launch, and checks
# the chips that VICE reports.
[targets.c64-ntsc]
model = "ntsc"                    # VICE -model: C64 NTSC
video = "ntsc"
vicii = "6567"
sid = "6581"
ram_kib = 64
kernal = "kernal-901227-03.bin"
basic = "basic-901226-01.bin"
chargen = "chargen-901225-01.bin"

# For the check: the label where the snapshot is taken, how many times the
# program must pass it, an address that must never run, and the run limit.
[check]
checkpoint = "frame"
hit = 3                           # include a second shot step before the snapshot
unreachable = ["frame+1"]         # mid-instruction: must never execute
cycle_limit = 20_000_000          # emulated cycles from power-on
screen = 0x0400
colours = 0xd800
border_ring = 16

[variants.start]
defines = ["TEST_KEYS:=$80"]

[variants.strafe]
defines = ["TEST_PLAY:=true", "TEST_KEYS:=$c3"]

[variants.slide]
defines = ["TEST_EDGE:=true", "TEST_PLAY:=true", "TEST_KEYS:=$33"]

[variants.hit]
defines = ["TEST_PLAY:=true", "TEST_HIT:=true", "TEST_KEYS:=$80"]

[variants.bonus]
defines = ["TEST_PLAY:=true", "TEST_HIT:=true", "TEST_BONUS:=true", "TEST_KEYS:=$80"]

[variants.clear]
defines = ["TEST_LIVES:=2","TEST_PLAY:=true", "TEST_HIT:=true", "TEST_LAST:=true", "TEST_KEYS:=$80"]

[variants.caught]
defines = ["TEST_PLAY:=true", "TEST_TOUCH:=true"]

[variants.game-over]
defines = ["TEST_PLAY:=true", "TEST_TOUCH:=true", "TEST_LIVES:=1", "TEST_TIMER:=1"]

[variants.respawn]
defines = ["TEST_PLAY:=true","TEST_TOUCH:=true","TEST_TIMER:=1"]

[variants.northeast]
defines = ["TEST_PLAY:=true","TEST_KEYS:=$69"]

[variants.southwest]
defines = ["TEST_PLAY:=true","TEST_KEYS:=$96"]

[variants.southeast]
defines = ["TEST_PLAY:=true","TEST_KEYS:=$3c"]

[variants.opposed]
defines = ["TEST_PLAY:=true","TEST_KEYS:=$ff"]

[variants.crowd]
defines = ["TEST_LEVEL:=2","TEST_PLAY:=true","TEST_KEYS:=$c3"]

[variants.victory]
defines = ["TEST_TARGET:=7","TEST_LEVEL:=2","TEST_PLAY:=true","TEST_LAST:=true","TEST_HIT:=true","TEST_KEYS:=$80"]

[variants.crowd-respawn]
defines = ["TEST_LEVEL:=2","TEST_PLAY:=true","TEST_TOUCH:=true","TEST_TIMER:=1"]

[variants.crowd-timing]
defines = ["TEST_LEVEL:=2","TEST_PLAY:=true","TEST_TIMING:=true","TEST_KEYS:=$80"]
